name: DevSecOps AI Pipeline

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: true
        default: 'initial'
        type: choice
        options:
          - initial
          - rescan
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: https://devsecops-dashboard.calmtree-dd2b6dea.eastus.azurecontainerapps.io
      SCAN_TYPE: ${{ github.event.inputs.scan_type || 'rescan' }}

    steps:
      - name: Checkout WebGoat
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Notify dashboard - scan complete
        run: |
          python3 -c "
import json, base64, urllib.request, os

scan_type = os.environ.get('SCAN_TYPE', 'initial')
run_id = os.environ.get('GITHUB_RUN_ID', '')
findings_count = int(os.environ.get('FINDINGS_COUNT', '0'))
dashboard_url = os.environ.get('DASHBOARD_URL', '')

try:
    with open(f'reports/{scan_type}_scan.json', 'rb') as f:
        content = base64.b64encode(f.read()).decode('utf-8')
except:
    content = base64.b64encode(b'{\"results\":[]}').decode('utf-8')

payload = json.dumps({
    'scan_type': scan_type,
    'pipeline_id': run_id,
    'findings_count': findings_count,
    'report_content': content
}).encode('utf-8')

req = urllib.request.Request(
    f'{dashboard_url}/webhook/scan-complete',
    data=payload,
    headers={'Content-Type': 'application/json'},
    method='POST'
)
try:
    urllib.request.urlopen(req, timeout=30)
    print('Dashboard notified successfully')
except Exception as e:
    print(f'Dashboard notification failed: {e}')
"



      - name: Run Semgrep SAST scan
        run: |
          mkdir -p reports

          # Find correct Java source path
          if [ -d "webgoat-lessons" ]; then
            SCAN_PATH="webgoat-lessons"
          elif [ -d "src/main/java" ]; then
            SCAN_PATH="src/main/java"
          else
            SCAN_PATH="."
          fi
          echo "Scanning path: $SCAN_PATH"

          semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            --json \
            --output=reports/${{ env.SCAN_TYPE }}_scan.json \
            --severity=WARNING \
            --severity=ERROR \
            --timeout=300 \
            $SCAN_PATH || true

          TOTAL=$(python3 -c "
import json
try:
    with open('reports/${{ env.SCAN_TYPE }}_scan.json') as f:
        d = json.load(f)
    print(len(d.get('results', [])))
except:
    print(0)
")
          echo "FINDINGS_COUNT=$TOTAL" >> $GITHUB_ENV
          echo "Findings: $TOTAL"


      - name: Notify dashboard - scan complete
        run: |
          REPORT_CONTENT=$(cat reports/${{ env.SCAN_TYPE }}_scan.json | base64 -w 0)
          curl -s -X POST "$DASHBOARD_URL/webhook/scan-complete" \
            -H "Content-Type: application/json" \
            -d "{\"scan_type\":\"$SCAN_TYPE\",\"pipeline_id\":\"${{ github.run_id }}\",\"findings_count\":$FINDINGS_COUNT,\"report_content\":\"$REPORT_CONTENT\"}" || true

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-${{ env.SCAN_TYPE }}
          path: reports/
          retention-days: 30
