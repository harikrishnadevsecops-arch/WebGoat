name: DevSecOps AI Pipeline

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: true
        default: 'initial'
        type: choice
        options:
          - initial
          - rescan
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: https://devsecops-dashboard.calmtree-dd2b6dea.eastus.azurecontainerapps.io
      SCAN_TYPE: ${{ github.event.inputs.scan_type || 'rescan' }}

    steps:
      - name: Checkout WebGoat
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Notify dashboard - scan starting
        run: |
          curl -s -X POST "$DASHBOARD_URL/webhook/step-update" \
            -H "Content-Type: application/json" \
            -d "{\"step\":\"scan\",\"status\":\"running\",\"scan_type\":\"$SCAN_TYPE\"}" || true

      - name: Run Semgrep SAST scan
        run: |
          mkdir -p reports
          if [ -d "webgoat-lessons" ]; then
            SCAN_PATH="webgoat-lessons"
          elif [ -d "src/main/java" ]; then
            SCAN_PATH="src/main/java"
          else
            SCAN_PATH="."
          fi
          echo "Scanning path: $SCAN_PATH"
          semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            --json \
            --output=reports/${SCAN_TYPE}_scan.json \
            --severity=WARNING \
            --severity=ERROR \
            --timeout=300 \
            $SCAN_PATH || true
          echo "Scan complete"

      - name: Count findings
        env:
          SCAN_TYPE: ${{ env.SCAN_TYPE }}
        run: |
          TOTAL=$(python3 scripts/count_findings.py)
          echo "FINDINGS_COUNT=$TOTAL" >> $GITHUB_ENV
          echo "Findings: $TOTAL"

      - name: Notify dashboard - scan complete
        env:
          SCAN_TYPE: ${{ env.SCAN_TYPE }}
          FINDINGS_COUNT: ${{ env.FINDINGS_COUNT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/notify_dashboard.py

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-${{ env.SCAN_TYPE }}
          path: reports/
          retention-days: 30
